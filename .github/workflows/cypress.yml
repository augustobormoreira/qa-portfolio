name: Cypress Test

on:
  push:
    branches: [ci-configuration]
  pull_request:
    branches: [ci-configuration]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cypress-tests
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Rodar Testes
        run: npx cypress run
